<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LovelyFi Integrated Panels</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .panel { border: 1px solid #ccc; border-radius: 5px; padding: 20px; margin: 20px 0; }
        .flow { color: #00f; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Integrated LovelyFi Panels</h1>
    <div class="panel" id="aviator">
        <h2>Aviator Panel</h2>
        <p>Details and functionality associated with Aviator Panel.</p>
    </div>
    <div class="panel" id="savings">
        <h2>Savings Panel</h2>
        <p>Details and functionality associated with Savings Panel.</p>
    </div>
    <div class="panel" id="commission">
        <h2>Commission Panel</h2>
        <p>Details and functionality associated with Commission Panel.</p>
    </div>
    <div class="flow">
        <p>LFC Flowing between panels</p>
    </div>
</body>
</html>
